name: 打包安卓 APK

# 推送即构建，也可在 Actions 页面点 Run workflow 手动触发
on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  apk:
    name: buildozer debug apk
    runs-on: ubuntu-22.04
    timeout-minutes: 240

    steps:
      - name: 取代码
        uses: actions/checkout@v4

      - name: 钉住构建参数
        run: |
          # python-for-android 的 2024.01.21 里 hostpython3 与 python3 都是 3.11.5，
          # 与 pygame 2.6.1 是能对上的一代；master 已升到 3.14.2 会直接报错。
          sed -i 's|^requirements *=.*|requirements = python3==3.11.5,pygame==2.6.1|' buildozer.spec
          sed -i '/^android.ndk *=/d; /^p4a.branch *=/d; /^android.api *=/d' buildozer.spec
          sed -i '/^p4a.bootstrap *=/a android.ndk = 25b\np4a.branch = 2024.01.21\nandroid.api = 33' buildozer.spec
          echo "--- 最终生效的关键行 ---"
          grep -nE "^(requirements|android\.ndk|p4a\.branch|android\.api|android\.archs)" buildozer.spec

      - name: 装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 系统依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq git zip unzip autoconf automake libtool \
            pkg-config zlib1g-dev libncurses-dev libtinfo6 cmake libffi-dev \
            libssl-dev ccache
          python3 --version
          java -version 2>&1 | head -1

      - name: 装 buildozer
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install "setuptools==68.2.2" "wheel==0.41.2" \
            "cython==0.29.36" "buildozer==1.5.0"
          buildozer --version

      # buildozer 内部用 `git clone -b 2024.01.21 --single-branch` 取 p4a，
      # 这个写法在 GitHub 上取不到（第 6 次构建就是在这里失败的），
      # 所以改成自己按 refs/tags 精确取，放到 buildozer 认的目录里；
      # 分支名仍叫 2024.01.21，buildozer 核对 url/分支一致后会直接复用、不再 clone。
      - name: 预置 p4a 源码
        run: |
          set -e
          PLAT="$HOME/.buildozer/android/platform"
          P4A="$PLAT/python-for-android"
          mkdir -p "$PLAT"
          rm -rf "$P4A"
          git init -q "$P4A"
          cd "$P4A"
          git remote add origin https://github.com/kivy/python-for-android.git
          ok=0
          for ref in refs/tags/2024.01.21 refs/tags/v2024.01.21 refs/heads/2024.01.21; do
            echo "尝试取 $ref"
            if git fetch -q --depth 1 origin "+$ref:refs/tags/p4a-src"; then ok=1; break; fi
          done
          if [ "$ok" != "1" ]; then
            echo "::error::p4a 的 2024.01.21 取不到，下面是远端真实引用"
            git ls-remote --tags origin | tail -30
            git ls-remote --heads origin | head -20
            exit 1
          fi
          git checkout -q -B 2024.01.21 FETCH_HEAD
          echo "--- 本地分支 ---"
          git branch -vv
          echo "--- 版本核对（应为 3.11.5 / 3.11.5）---"
          grep -m1 -E "^    version" pythonforandroid/recipes/hostpython3/__init__.py
          grep -m1 -E "^    version" pythonforandroid/recipes/python3/__init__.py
          du -sh "$P4A"

      - name: 构建 APK
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          set +e
          yes | buildozer -v android debug > build_out.log 2>&1
          code=$?
          if [ -z "$(ls bin/*.apk 2>/dev/null)" ]; then
            echo "::error::没有产出 apk，buildozer 退出码 $code，日志 $(wc -l < build_out.log) 行"
            echo "===== A. 日志开头 80 行 ====="
            sed -n '1,80p' build_out.log
            echo "===== B. 关键报错行 ====="
            grep -nE "ERROR|error:|Error:|Traceback|fatal:|Command failed|No such file" build_out.log | head -40
            echo "===== C. 失败命令前 40 行 ====="
            ln=$(grep -n "Command failed" build_out.log | tail -1 | cut -d: -f1)
            if [ -n "$ln" ]; then
              start=$((ln-40))
              [ "$start" -lt 1 ] && start=1
              sed -n "${start},$((ln+1))p" build_out.log
            else
              echo "（日志里没有 Command failed，看末尾 60 行）"
              tail -60 build_out.log
            fi
            exit 1
          fi
          echo "===== 成功，日志末尾 30 行 ====="
          tail -30 build_out.log

      - name: 上传 APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: 中国象棋-apk
          path: bin/*.apk
          if-no-files-found: error
