name: 打包安卓 APK

# 推送即构建，也可在 Actions 页面点 Run workflow 手动触发
on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  apk:
    name: buildozer debug apk
    runs-on: ubuntu-22.04
    timeout-minutes: 240

    steps:
      - name: 取代码
        uses: actions/checkout@v4

      - name: 钉住构建参数
        run: |
          # 不依赖仓库里 spec 的内容：构建时强制修正，避免版本漂移
          sed -i 's|^requirements *=.*|requirements = python3==3.11.5,pygame==2.6.1|' buildozer.spec
          sed -i '/^android.ndk *=/d; /^p4a.branch *=/d' buildozer.spec
          sed -i '/^p4a.bootstrap *=/a android.ndk = 25b\np4a.branch = master' buildozer.spec
          echo "--- 最终生效的关键行 ---"
          grep -nE "^(requirements|android\.ndk|p4a\.branch|android\.api|android\.archs)" buildozer.spec

      - name: 系统依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq git zip unzip openjdk-17-jdk-headless \
            autoconf automake libtool pkg-config zlib1g-dev libncurses-dev \
            libtinfo6 cmake libffi-dev libssl-dev ccache
          echo "--- 环境 ---"
          python3 --version
          java -version 2>&1 | head -1
          echo "--- 本次生效的 spec ---"
          grep -E "^(requirements|android.ndk|android.api|p4a.branch)" buildozer.spec || true

      - name: 装 buildozer
        run: |
          python3 -m pip install --upgrade pip setuptools wheel
          python3 -m pip install buildozer
          buildozer --version

      - name: 缓存 SDK / NDK / p4a
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: bz-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            bz-${{ runner.os }}-

      - name: 构建 APK
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          yes | buildozer -v android debug 2>&1 | tail -300
          echo "--- 产物 ---"
          ls -l bin/ 2>/dev/null || true
          test -n "$(ls bin/*.apk 2>/dev/null)" || { echo "::error::没有产出 apk"; exit 1; }

      - name: 失败时打印关键报错
        if: failure()
        run: |
          for f in $(find .buildozer -name build.log 2>/dev/null); do
            echo "===== $f ====="
            grep -nE "error:|Error|ERROR|Traceback|fatal error" "$f" | tail -60 || true
            echo "----- 日志末尾 -----"
            tail -80 "$f"
          done

      - name: 上传 APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: 中国象棋-apk
          path: bin/*.apk
          if-no-files-found: error
