name: 打包安卓 APK

# 推送即构建，也可在 Actions 页面点 Run workflow 手动触发
on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  apk:
    name: buildozer debug apk
    runs-on: ubuntu-22.04
    timeout-minutes: 240

    steps:
      - name: 取代码
        uses: actions/checkout@v4

      - name: 钉住构建参数
        run: |
          # 关键：python-for-android 的 tag 2024.01.21 里 hostpython3 与 python3 都是 3.11.5，
          # 与 pygame 2.6.1 是能对上的一代。
          # master 分支已升到 Python 3.14.2，会把 python3 顶成 3.14，于是报
          # "python3 should have same version as hostpython3, 3.14.2"。
          sed -i 's|^requirements *=.*|requirements = python3==3.11.5,pygame==2.6.1|' buildozer.spec
          sed -i '/^android.ndk *=/d; /^p4a.branch *=/d; /^android.api *=/d' buildozer.spec
          sed -i '/^p4a.bootstrap *=/a android.ndk = 25b\np4a.branch = 2024.01.21\nandroid.api = 33' buildozer.spec
          echo "--- 最终生效的关键行 ---"
          grep -nE "^(requirements|android\.ndk|p4a\.branch|android\.api|android\.archs)" buildozer.spec

      - name: 装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 系统依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq git zip unzip autoconf automake libtool \
            pkg-config zlib1g-dev libncurses-dev libtinfo6 cmake libffi-dev \
            libssl-dev ccache
          python3 --version
          java -version 2>&1 | head -1

      - name: 装 buildozer
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install "setuptools==68.2.2" "wheel==0.41.2" \
            "cython==0.29.36" "buildozer==1.5.0"
          buildozer --version

      - name: 构建 APK
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          set +e
          yes | buildozer -v android debug > build_out.log 2>&1
          code=$?
          echo "buildozer 退出码 $code"
          echo "--- 产物 ---"
          ls -l bin/ 2>/dev/null || true
          if [ -z "$(ls bin/*.apk 2>/dev/null)" ]; then
            echo "::error::没有产出 apk"
            echo "===== 关键报错 ====="
            grep -nE "ERROR|error:|Error|Traceback|fatal error|Build failed|No such file" build_out.log | tail -60 || true
            echo "===== 日志末尾 120 行 ====="
            tail -120 build_out.log
            exit 1
          fi
          echo "===== 日志末尾 40 行 ====="
          tail -40 build_out.log

      - name: 上传 APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: 中国象棋-apk
          path: bin/*.apk
          if-no-files-found: error
