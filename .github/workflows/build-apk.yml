name: 打包安卓 APK

# 推送即构建，也可在 Actions 页面点 Run workflow 手动触发
on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  apk:
    name: buildozer debug apk
    runs-on: ubuntu-22.04
    timeout-minutes: 240

    steps:
      - name: 取代码
        uses: actions/checkout@v4

      - name: 钉住构建参数
        run: |
          # python-for-android 的 v2024.01.21 里 hostpython3 与 python3 都是 3.11.5，
          # 与 pygame 2.5.2 是能对上的一代；p4a 里的 pygame 配方本身是按 2.1.0 写的，
          # pygame 2.6.1 太新（改了编译脚本），所以退到 2.5.2。
          sed -i 's|^requirements *=.*|requirements = python3==3.11.5,pygame==2.5.2|' buildozer.spec
          sed -i '/^android.ndk *=/d; /^p4a.branch *=/d; /^p4a.source_dir *=/d; /^android.api *=/d' buildozer.spec
          sed -i '/^p4a.bootstrap *=/a android.ndk = 25b\np4a.branch = 2024.01.21\nandroid.api = 33\np4a.source_dir = '"$GITHUB_WORKSPACE"'/p4a-src' buildozer.spec
          echo "--- 最终生效的关键行 ---"
          grep -nE "^(requirements|android\.ndk|p4a\.branch|p4a\.source_dir|android\.api|android\.archs)" buildozer.spec

      - name: 装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 系统依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq git zip unzip autoconf automake libtool \
            pkg-config zlib1g-dev libncurses-dev libtinfo6 cmake libffi-dev \
            libssl-dev ccache
          python3 --version
          java -version 2>&1 | head -1

      - name: 装 buildozer
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install "setuptools==68.2.2" "wheel==0.41.2" \
            "cython==0.29.36" "buildozer==1.5.0"
          buildozer --version

      # buildozer 内部用 `git clone -b 2024.01.21 --single-branch` 取 p4a，
      # 这个写法在 GitHub 上取不到（第 6、7 次构建都在这里失败），
      # 所以改成自己按 refs/tags 精确取，再用 spec 里的 p4a.source_dir 直接指向它，
      # buildozer 就不会再跑任何 git 逻辑。代价是 p4a 的运行依赖要我们自己装。
      - name: 预置 p4a 源码
        run: |
          set -e
          P4A="$GITHUB_WORKSPACE/p4a-src"
          rm -rf "$P4A"
          git init -q "$P4A"
          cd "$P4A"
          git remote add origin https://github.com/kivy/python-for-android.git
          ok=0
          for ref in refs/tags/v2024.01.21 refs/tags/2024.01.21 refs/heads/2024.01.21; do
            echo "尝试取 $ref"
            if git fetch -q --depth 1 origin "+$ref:refs/tags/p4a-src"; then ok=1; break; fi
          done
          if [ "$ok" != "1" ]; then
            echo "::error::p4a 的 2024.01.21 取不到，下面是远端真实引用"
            git ls-remote --tags origin | tail -30
            git ls-remote --heads origin | head -20
            exit 1
          fi
          git checkout -q -B 2024.01.21 FETCH_HEAD
          echo "--- 版本核对（应为 3.11.5 / 3.11.5）---"
          grep -m1 -E "^    version" pythonforandroid/recipes/hostpython3/__init__.py
          grep -m1 -E "^    version" pythonforandroid/recipes/python3/__init__.py
          echo "--- 装 p4a 运行依赖 ---"
          python3 -m pip install --user "appdirs" "colorama>=0.3.3" "jinja2" \
            "sh>=1.10,<2.0" "build" "toml" "packaging"
          python3 -c "import pythonforandroid; print('p4a 可导入:', pythonforandroid.__file__)"

      - name: 构建 APK
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          set +e
          yes | buildozer -v android debug > build_out.log 2>&1
          code=$?
          if [ -z "$(ls bin/*.apk 2>/dev/null)" ]; then
            echo "::error::没有产出 apk，buildozer 退出码 $code，日志 $(wc -l < build_out.log) 行"
            echo "===== A. 最后在编哪个配方 ====="
            grep -nE "Building recipe|Installing .* into|Recipe .* is already" build_out.log | tail -8
            echo "===== B. 报错行（取最后 30 条）====="
            grep -nE "error:|Error:|ERROR|fatal:|Traceback|Command failed|No such file" build_out.log | tail -30
            echo "===== C. 日志最后 200 行原文 ====="
            tail -200 build_out.log
            exit 1
          fi
          echo "===== 成功，日志末尾 30 行 ====="
          tail -30 build_out.log

      - name: 失败时把完整日志存成文件
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: 构建日志
          path: build_out.log
          if-no-files-found: ignore

      - name: 上传 APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: 中国象棋-apk
          path: bin/*.apk
          if-no-files-found: error
